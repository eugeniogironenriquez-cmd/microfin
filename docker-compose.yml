version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: microfin_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-microfin}
      MYSQL_USER: ${DB_USER:-microfin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-microfin2024}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root2024}
      TZ: America/Mexico_City
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root2024}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: microfin_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-microfin}
      DB_USER: ${DB_USER:-microfin}
      DB_PASSWORD: ${DB_PASSWORD:-microfin2024}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_refresh_32chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microfin_web
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: microfin_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  uploads_data:
